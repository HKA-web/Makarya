appId: com.makarya.ide
productName: Makarya IDE
directories:
  output: dist
  buildResources: build

files:
  - "out/**/*"
  - "src/main/splash/**/*"

# Skip native node-gyp rebuild because node-pty already provides prebuilt binaries
npmRebuild: false

# Unpack native binary addons from ASAR so Windows can execute them directly
asarUnpack:
  - "**/*.node"
  - "**/node-pty/**"
  - "**/@vscode/ripgrep/**"
  - "**/@vscode/ripgrep-*/**"
  - "**/*rg.exe*"
  - "**/*rg*"

afterAllArtifactBuild: scripts/rename-artifacts.js

win:
  icon: build/icon.ico
  artifactName: "Makarya.IDE.v${version}.${ext}"
  extraResources:
    - from: "node_modules/@vscode/ripgrep-win32-x64/bin/rg.exe"
      to: "bin/rg.exe"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Makarya IDE
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: "Makarya.IDE.Setup.v${version}.${ext}"

portable:
  artifactName: "Makarya.IDE.v${version}.${ext}"

